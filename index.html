<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&display=swap">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">
  
  <title>Frontend Mentor | Blog preview card</title>

</head>
<body>
  <div class="container">
    <main class="card-body">
      <picture class="thumbnail">
        <source media="(max-width:350px)" srcset="./images/illustration-article-small.svg">
        <img src="./images/illustration-article.svg" alt="Blog Thumbnail">
      </picture>

      <article class="card-content">
        <div class="details">
          <p class="details-tag">Learning</p><br>
          <time class="small date">Published 21 Dec 2023</time>
        </div>

        <div class="card-message">
          <h2><a href="javascript:void(0)">HTML & CSS foundations</a></h2>
          <p class="small">
            These languages are the backbone of every website, defining structure, content, and presentation.
          </p>
        </div>

        <div class="card-owner">
          <img src="./images/image-avatar.webp" alt="Greg Hooper, author" class="avatar">
          <p class="name">Greg Hooper</p>
        </div>
      </article>
    </main>

    <footer class="attribution">
      Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
      Coded by <a href="https://github.com/swaandaFJ">swaandaFJ</a>.
    </footer>
  </div>
  
</body>
</html>
